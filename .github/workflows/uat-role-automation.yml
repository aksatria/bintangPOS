name: UAT Role Automation

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  uat-role-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Prepare env
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Run migration
        run: php artisan migrate --force
      - name: Run role-based UAT automation
        run: php artisan test tests/Feature/UatRoleAutomationTest.php tests/Feature/SystemSafetyAndOpsTest.php

